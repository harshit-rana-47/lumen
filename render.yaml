services:
  - type: web
    name: lumen-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm -w @lumen/api run build
    startCommand: npm -w @lumen/api run start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
